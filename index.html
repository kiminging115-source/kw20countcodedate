<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Count Code Date System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAgehd9UslGFUdP4Cw3dWVd3PWGqAXexsQ",
    authDomain: "product-management-42e04.firebaseapp.com",
    projectId: "product-management-42e04",
    storageBucket: "product-management-42e04.firebasestorage.app",
    messagingSenderId: "369245036621",
    appId: "1:369245036621:web:7ece4c7254d7d8ff4cfc04"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Expose fetchProductImage globally so inline JS can call it
  window.fetchProductImage = async function(productCode, imgElementId) {
    try {
      const docRef = doc(db, 'products', String(productCode));
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        // Try common image field names
        const imgData = data.image || data.picture || data.photo || data.img ||
                        data.imageBase64 || data.imageUrl || data.Image ||
                        data.Picture || data.imageData || null;
        if (imgData) {
          const el = document.getElementById(imgElementId);
          if (el) {
            el.innerHTML = '<img src="' + imgData + '" style="max-height:180px;max-width:100%;object-fit:contain">';
          }
        } else {
          // Log all fields to help identify the image field
          console.log('Fields for product ' + productCode + ':', Object.keys(data));
        }
      } else {
        console.log('No document found for product:', productCode);
      }
    } catch(e) {
      console.error('Firebase error:', e);
    }
  };

  // ───────────────────────────────────────────────────────────
  //  Count Code Date — cross-device sync (single newest dataset)
  //  Collection 'ccd_data':
  //    manifest  -> {chunks,total,uploadedAt,fileName}
  //    chunk_0.. -> {rows:[...]}   (dataset split into pieces)
  //    progress  -> {cf,cv}        (confirmation progress, JSON strings)
  //  On every new upload the old chunks + progress are deleted first,
  //  so Firebase always holds ONLY the newest file.
  // ───────────────────────────────────────────────────────────
  const CCD_COL = 'ccd_data';
  const CCD_CHUNK = 150; // rows per document

  // Replace the stored dataset with a brand-new one (delete old → write new)
  window.ccdSaveDataset = async function(rowsArr, fileName){
    const manifestRef = doc(db, CCD_COL, 'manifest');
    // 1) delete every old chunk based on the previous manifest
    try{
      const old = await getDoc(manifestRef);
      if(old.exists()){
        const n = old.data().chunks || 0;
        for(let s=0; s<n; s+=400){
          const batch = writeBatch(db);
          for(let i=s; i<Math.min(n, s+400); i++) batch.delete(doc(db, CCD_COL, 'chunk_'+i));
          await batch.commit();
        }
      }
    }catch(e){ console.warn('ccd: clearing old chunks failed', e); }
    // 2) clear old progress so a new file starts fresh
    try{ await deleteDoc(doc(db, CCD_COL, 'progress')); }catch(e){}
    // 3) write the new chunks
    const chunks = Math.ceil(rowsArr.length / CCD_CHUNK);
    for(let i=0; i<chunks; i++){
      const slice = rowsArr.slice(i*CCD_CHUNK, (i+1)*CCD_CHUNK);
      await setDoc(doc(db, CCD_COL, 'chunk_'+i), { rows: slice });
    }
    // 4) write the manifest last (marks the upload as complete)
    await setDoc(manifestRef, { chunks, total: rowsArr.length, fileName: fileName||'', uploadedAt: Date.now() });
    return { chunks, total: rowsArr.length };
  };

  // Read the newest dataset back. Returns {rows, meta} or null if none.
  window.ccdLoadDataset = async function(){
    const snap = await getDoc(doc(db, CCD_COL, 'manifest'));
    if(!snap.exists()) return null;
    const m = snap.data();
    const out = [];
    for(let i=0; i<(m.chunks||0); i++){
      const c = await getDoc(doc(db, CCD_COL, 'chunk_'+i));
      if(c.exists()) out.push(...(c.data().rows||[]));
    }
    return { rows: out, meta: m };
  };

  // Save confirmation progress (whole cf/cv objects, last-write-wins)
  window.ccdSaveProgress = async function(cfObj, cvObj){
    try{
      await setDoc(doc(db, CCD_COL, 'progress'), {
        cf: JSON.stringify(cfObj||{}),
        cv: JSON.stringify(cvObj||{}),
        updatedAt: Date.now()
      });
    }catch(e){ console.warn('ccd: save progress failed', e); }
  };

  // Live-subscribe to progress changes from other devices
  window.ccdSubscribeProgress = function(cb){
    try{
      return onSnapshot(doc(db, CCD_COL, 'progress'), snap=>{
        let cfObj = {}, cvObj = {};
        if(snap.exists()){
          const d = snap.data();
          try{ cfObj = JSON.parse(d.cf||'{}'); }catch(e){}
          try{ cvObj = JSON.parse(d.cv||'{}'); }catch(e){}
        }
        cb(cfObj, cvObj);
      });
    }catch(e){ console.warn('ccd: subscribe failed', e); }
  };

  // Delete the entire stored dataset + progress from Firebase
  window.ccdClearDataset = async function(){
    const manifestRef = doc(db, CCD_COL, 'manifest');
    try{
      const old = await getDoc(manifestRef);
      if(old.exists()){
        const n = old.data().chunks || 0;
        for(let s=0; s<n; s+=400){
          const batch = writeBatch(db);
          for(let i=s; i<Math.min(n, s+400); i++) batch.delete(doc(db, CCD_COL, 'chunk_'+i));
          await batch.commit();
        }
      }
    }catch(e){ console.warn('ccd: clear chunks failed', e); }
    try{ await deleteDoc(manifestRef); }catch(e){}
    try{ await deleteDoc(doc(db, CCD_COL, 'progress')); }catch(e){}
  };

  // The inline script registers window.onCcdReady before this module runs.
  if(typeof window.onCcdReady === 'function') window.onCcdReady();
</script>

      localStorage.setItem('wms_cv',JSON.stringify(cv));
    }catch(e){console.warn('localStorage save failed:',e);}
    const s=rows.filter(r=>r.location_type==='S').length;
    const rv=rows.filter(r=>r.location_type==='R').length;
    toast('✓ '+rows.length+' items need clearance (N<0) — S:'+s+' R:'+rv);
    // Push to Firebase as the single newest dataset (deletes old file first)
    if(window.ccdSaveDataset){
      const btn=document.getElementById('bu-csv');
      const old=btn?btn.innerHTML:''; if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-cloud-upload"></i> Syncing…';}
      try{
        await window.ccdSaveDataset(rows, f.name);
        toast('☁ Synced to Firebase — all devices now show this file');
      }catch(err){
        console.warn('Firebase sync failed:',err);
        toast('⚠ Saved on this device, but Firebase sync failed (check connection)');
      }finally{
        if(btn){btn.disabled=false;btn.innerHTML=old;}
      }
    }
  };
  rd.readAsText(f);
}
function onPickLife(i){const f=i.files[0];document.getElementById('fn-life').textContent=f?f.name:'No file chosen';document.getElementById('bu-life').disabled=!f;}
function loadLifeFile(){
  const f=document.getElementById('fi-life').files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    const lines=e.target.result.split('\n');
    const hdrs=lines[0].replace(/^\uFEFF/,'').split(',').map(h=>h.trim().toUpperCase());
    const idIdx=hdrs.indexOf('ITEM_ID'),lifeIdx=hdrs.indexOf('PRODUCT_LIFE');
    if(idIdx<0||lifeIdx<0){toast('CSV needs ITEM_ID and PRODUCT_LIFE columns');return;}
    const nm={};
    for(let i=1;i<lines.length;i++){
      const v=lines[i].split(',');
      const id=(v[idIdx]||'').trim(),life=parseInt((v[lifeIdx]||'').trim());
      if(id&&!isNaN(life)&&life>0)nm[id]=life;
    }
    lifeMap=nm;
    try{localStorage.setItem('wms_lifeMap',JSON.stringify(nm));}catch(e){}
    const el=document.getElementById('life-status');
    el.innerHTML='<i class="ti ti-circle-check"></i> Product life loaded: '+Object.keys(nm).length+' products';
    el.className='life-status ok';
    toast('✓ Product life updated: '+Object.keys(nm).length+' products');
  };
  rd.readAsText(f);
}
async function clearAllData(){
  if(!confirm('Clear all saved CSV data and confirmations — on this device AND Firebase (all devices)? This cannot be undone.')) return;
  localStorage.removeItem('wms_rows');
  localStorage.removeItem('wms_cf');
  localStorage.removeItem('wms_cv');
  localStorage.removeItem('wms_lifeMap');
  rows=[];am={};cf={};cv={};lifeMap=Object.assign({},BUILT_IN_LIFE);
  document.getElementById('fn-csv').textContent='No file chosen';
  document.getElementById('bu-csv').disabled=true;
  if(window.ccdClearDataset){
    try{ await window.ccdClearDataset(); toast('✓ Cleared on all devices.'); }
    catch(e){ toast('✓ Cleared here, but Firebase clear failed.'); }
  }else{
    toast('✓ Saved data cleared.');
  }
}
function sortAisles(a){return a.sort((x,y)=>{const nx=parseInt(x),ny=parseInt(y);if(!isNaN(nx)&&!isNaN(ny))return nx-ny;if(!isNaN(nx))return -1;if(!isNaN(ny))return 1;return x.localeCompare(y);});}
function hoverAisle(el, a, gid){
  const bg=el.style.background||'';
  if(bg.includes('1a6e3c')||bg.includes('f0b429')) return;
  el.setAttribute('style','background:#2563eb;border:2px solid #2563eb');
  el.querySelectorAll('.an,.ak,.as').forEach(t=>t.setAttribute('style','color:#fff'));
}

function unhoverAisle(el, a, gid){
  restoreCardColor(el, a, gid);
}

function restoreCardColor(el, a, gid){
  const isR = gid==='rg', tt = isR?'R':'S';
  const items = (am[a]||[]).filter(r=>r.location_type===tt);
  const tot = items.length;
  const done = items.filter(r=>cf[(r.location_id||r.location)+'|'+(r.product_code||r.product_code_input)]).length;
  if(done===tot&&tot>0){
    el.setAttribute('style','background:#1a6e3c;border:2px solid #1a6e3c');
    el.querySelectorAll('.an,.ak,.as').forEach(t=>t.setAttribute('style','color:#fff'));
  } else if(done>0){
    el.setAttribute('style','background:#f0b429;border:2px solid #f0b429');
    el.querySelectorAll('.an,.ak,.as').forEach(t=>t.setAttribute('style','color:#1a0f00'));
  } else {
    el.setAttribute('style','');
    el.querySelectorAll('.an,.ak,.as').forEach(t=>t.setAttribute('style',''));
  }
}
function selectAisle(a, back, gid){
  // Restore card color before navigating away
  const card = document.getElementById('ac-'+a+'-'+gid);
  if(card) restoreCardColor(card, a, gid);
  openAisle(a, back);
}

function goSelect(){const a=Object.keys(am).filter(a=>am[a].some(r=>r.location_type==='S'));renderGrid('ag',a,'sa');go('sa');}
function goReserve(){const a=Object.keys(am).filter(a=>am[a].some(r=>r.location_type==='R'));renderGrid('rg',a,'sr');go('sr');}
function renderGrid(gid,aisles,back){
  const g=document.getElementById(gid);g.innerHTML='';
  const isR=gid==='rg',tt=isR?'R':'S';
  if(!sortAisles(aisles).length){g.innerHTML='<div class="empty-state"><i class="ti ti-database-off"></i><div>No items needing clearance (N&lt;0).<br>Upload a CSV file first.</div></div>';return;}
  aisles.forEach(a=>{
    const items=am[a].filter(r=>r.location_type===tt),tot=items.length;
    const done=items.filter(r=>cf[(r.location_id||r.location)+'|'+(r.product_code||r.product_code_input)]).length;
    let cls='ac',st='ยังไม่เริ่ม';
    let bgStyle='', borderStyle='', txtStyle='';
    if(tot>0&&done===tot){
      cls='ac done';st='นับเสร็จ';
      bgStyle='background:#1a6e3c';borderStyle='border-color:#1a6e3c';txtStyle='color:#fff';
    } else if(done>0){
      cls='ac inprog';st='กำลังนับ';
      bgStyle='background:#f0b429';borderStyle='border-color:#f0b429';txtStyle='color:#1a0f00';
    }
    g.innerHTML+=`<div class="ac" id="ac-${a}-${gid}" style="${bgStyle};${borderStyle}"
      onclick="selectAisle('${a}','${back}','${gid}')"
      onmouseover="hoverAisle(this,'${a}','${gid}')"
      onmouseout="unhoverAisle(this,'${a}','${gid}')">
      <div class="an" style="${txtStyle}">${a}</div>
      <div class="ak" style="${txtStyle}">${done}/${tot}</div>
      <div class="as" style="${txtStyle}">${st}</div>
    </div>`;
  });
}

          </div>
        </div>

        <!-- Row 2 -->
        <div style="display:flex;gap:10px">

function fmtDate(el, key){
  // Auto-format as dd/mm/yyyy while typing
  let v = el.value.replace(/\D/g,'');
  if(v.length>=3 && v.length<=4) v = v.slice(0,2)+'/'+v.slice(2);
  else if(v.length>4) v = v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4,8);
  el.value = v;
  cv[key] = v;
  try{localStorage.setItem('wms_cv',JSON.stringify(cv));}catch(e){}
  pushProgress();
}
function pickDate(dp, textId, key){
  // Convert yyyy-mm-dd from date picker to dd/mm/yyyy in text field
  if(!dp.value) return;
  const parts = dp.value.split('-');
  const formatted = parts[2]+'/'+parts[1]+'/'+parts[0];
  document.getElementById(textId).value = formatted;
  cv[key] = formatted;
  try{localStorage.setItem('wms_cv',JSON.stringify(cv));}catch(e){}
  pushProgress();
}
function ci(i,key){
  const v=document.getElementById('ccd-'+i).value;
  if(!v){toast('Please enter Count Code Date first');return;}
  // Validate basic date format dd/mm/yyyy
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(v)){toast('Please enter date as dd/mm/yyyy');return;}
  cv[key]=v; cf[key]=true;
  try{localStorage.setItem('wms_cf',JSON.stringify(cf));localStorage.setItem('wms_cv',JSON.stringify(cv));}catch(e){}
  pushProgress();
  // Remove the card from view with a fade animation
  const card=document.getElementById('cb-'+i).closest('.ic');
  if(card){
    card.style.transition='opacity .4s';
    card.style.opacity='0';
    setTimeout(()=>{
      card.remove();
      // Check if no cards left → go back to aisle grid
      const remaining=document.querySelectorAll('#il .ic');
      if(remaining.length===0){
        toast('✓ All items in this aisle confirmed!');
        setTimeout(()=>{ document.getElementById('ibk').click(); },800);
      } else {
        toast('✓ Confirmed! Item removed.');
      }
    },400);
  }
}

  const conf=Object.keys(cf).length,total=rows.length,
        s=rows.filter(r=>r.location_type==='S').length,
        rv=rows.filter(r=>r.location_type==='R').length;
  document.getElementById('eb').innerHTML=`
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1.25rem;max-width:600px;margin:0 auto">
    <div style="font-size:14px;font-weight:600;color:#111827;margin-bottom:.875rem">Summary — ${T.toLocaleDateString('en-GB')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.625rem;margin-bottom:1rem">
      <div style="background:#fef2f2;border-radius:8px;padding:.875rem;text-align:center"><div style="font-size:22px;font-weight:500;color:#b91c1c">${total}</div><div style="font-size:12px;color:#ef4444">Items needing clearance (N&lt;0)</div></div>
      <div style="background:#f0fdf4;border-radius:8px;padding:.875rem;text-align:center"><div style="font-size:22px;font-weight:500;color:#15803d">${conf}</div><div style="font-size:12px;color:#16a34a">Confirmed</div></div>
      <div style="background:#eff6ff;border-radius:8px;padding:.875rem;text-align:center"><div style="font-size:22px;font-weight:500;color:#2563eb">${s}</div><div style="font-size:12px;color:#3b82f6">Select (S)</div></div>
      <div style="background:#f5f3ff;border-radius:8px;padding:.875rem;text-align:center"><div style="font-size:22px;font-weight:500;color:#6d28d9">${rv}</div><div style="font-size:12px;color:#7c3aed">Reserve (R)</div></div>
    </div>
    <button onclick="dlCSV()" style="background:#0f766e;color:#fff;border:none;border-radius:8px;padding:.75rem;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:.5rem;width:100%;justify-content:center">
      <i class="ti ti-download"></i> Download CSV (${total} rows)
    </button>
  </div>`;
  go('se');
}

function dlCSV(){
  const hdrs=['location_id','location_type','aisle','product_code','description','receive_date','code_date','K_product_life','L_store_threshold','M_days_remaining','N_clearance_days','boh','ccd_entered'];
  const data=rows.map(r=>{
    const locId=r.location_id||r.location||'',pc=r.product_code||r.product_code_input||'',k=locId+'|'+pc;
    return[locId,r.location_type,r.aisle,pc,'"'+(r.description||'')+'"',r.receive_date||'',r.code_date||'',r._K||'',r._L||'',r._M||'',r._N||'',r.countbook_qty||'',cv[k]||''].join(',');
  });
  const blob=new Blob([[hdrs.join(','),...data].join('\n')],{type:'text/csv'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'ccd_clearance_export.csv'});
  a.click();URL.revokeObjectURL(a.href);toast('✓ CSV downloaded!');
}
